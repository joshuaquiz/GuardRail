<div>
  <div>
    <div class="accounts">
      @if (SingleAccount) {
      <div>
        <span>
          {{SelectedAccount.Name}}
        </span>
      </div>
      } @else {
      <select [(value)]="SelectedAccount"
              (change)="AccountSelectionChanged($event)">
        @for (acc of Accounts; track acc.Guid) {
        <option [value]="acc.Guid">
          {{acc.Name}}
        </option>
        }
      </select>
      }
    </div>
  </div>
  <div>
    <div class="left">
      <NavBar />
    </div>
    <div class="right">
      <div>
        @if (ShowLocations) {
        <locations />
        }
        @if (ShowAccessPoints) {
        <access-points />
        }
        @if (ShowUsers) {
        <users />
        }
      </div>
    </div>
  </div>
</div>
