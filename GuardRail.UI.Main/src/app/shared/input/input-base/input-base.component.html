<div class="form-group">
  <label>{{ Label }}</label>
  <input [type]="Type"
         [value]="InputValue"
         (input)="onInputChange($event)"
         (blur)="onTouched()"
         [ngClass]="{'is-invalid': hasErrors()}" />
  <div *ngIf="hasErrors()" class="invalid-feedback">
    <div *ngFor="let error of getErrors()">{{ error }}</div>
  </div>
</div>
