<div>
  <div>
    <gr-dialog [Buttons]="Buttons"
               [CanClose]="false">
      <InputBase Label="Email"
                 [(InputValue)]="Email"
                 [validators]="[requiredValidator, emailValidator]"
                 Type="text" />
      <InputBase Label="Password"
                 [(InputValue)]="Password"
                 [validators]="[requiredValidator, minLengthValidator(8)]"
                 Type="password" />
    </gr-dialog>
  </div>
</div>
